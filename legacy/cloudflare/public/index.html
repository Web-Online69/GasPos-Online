<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GASPOS Online</title><style>body{font-family:system-ui;background:#20252c;color:#e6e8eb;margin:0}header,main{max-width:980px;margin:auto;padding:20px}.panel{background:#303741;border:1px solid #46505c;border-radius:13px;padding:20px;margin:15px 0}input,select,button{padding:12px;margin:5px 6px 8px 0;border-radius:7px;border:1px solid #697583;background:#242a32;color:#fff}button{cursor:pointer;background:#3f6780}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #515b68;padding:9px}#message{color:#ffd589}nav button{margin:5px}@media(max-width:680px){table{font-size:12px}header,main{padding:12px}}</style></head><body><header><h1>GASPOS Online</h1><p id="message">Versi pengembangan — bukan untuk transaksi asli.</p></header><main><section id="login" class="panel"><h2>Masuk</h2><form id="loginForm"><input name="username" placeholder="Username" autocomplete="username" required><input name="password" type="password" placeholder="Password" autocomplete="current-password" required><button>Masuk</button></form></section><section id="workspace" style="display:none"><div class="panel"><span id="role"></span> <button id="logout">Keluar</button><nav id="nav"></nav></div><div id="content" class="panel"></div></section></main><script src="/app.js"></script></body></html>
